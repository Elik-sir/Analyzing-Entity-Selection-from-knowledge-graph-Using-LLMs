[project]
name = "graph-motives-reproduction"
version = "0.3.0"
description = "Configurable model runs over the frozen article experiments"
requires-python = ">=3.12"
dependencies = [
  "langchain-openai>=1,<2",
  "matplotlib>=3.9,<4",
  "neo4j>=5.28,<7",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

